<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#080c0e">
  <title>A · 두 개의 세계 | 입구 디자인</title>
  <link rel="stylesheet" href="entrance.css"><script src="entrance.js" defer></script>
</head>
<body class="cinema">
  <h1 class="site-sign">스트리머 전적</h1>
  <main class="worlds" aria-label="게임 선택">
    <a class="game world world-fc" href="/fc/search" aria-label="FC온라인 전적 검색">
      <img class="world-art drift" src="/images/fc/home-stadium.png" alt="" fetchpriority="high">
      <div class="world-shade" aria-hidden="true"></div>
      <div class="field-lines" aria-hidden="true"><span></span></div>
      <div class="beam" aria-hidden="true"></div>
      <div class="motes" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <span class="world-index" aria-hidden="true">01 <i></i></span>
      <div class="world-content">
        <div class="fc-lockup" aria-hidden="true"><strong>FC</strong><span>ONLINE</span></div>
        <h2>FC온라인</h2>
        <div class="world-cta"><span>전적 검색</span><span class="arrow" aria-hidden="true">↗</span></div>
      </div>
      <span class="hover-light" aria-hidden="true"></span>
    </a>
    <a class="game world world-lol" href="/lol" aria-label="리그 오브 레전드 전적 검색">
      <img class="world-art drift" src="/images/arena/Ahri.jpg" alt="" fetchpriority="high">
      <div class="world-shade" aria-hidden="true"></div>
      <div class="arcane-ring" aria-hidden="true"><span></span></div>
      <div class="motes" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <span class="world-index" aria-hidden="true">02 <i></i></span>
      <div class="world-content">
        <div class="league-lockup" aria-hidden="true"><span>LEAGUE <em>OF</em></span><strong>LEGENDS</strong></div>
        <h2>리그 오브 레전드</h2>
        <div class="world-cta"><span>전적 검색</span><span class="arrow" aria-hidden="true">↗</span></div>
      </div>
      <span class="hover-light" aria-hidden="true"></span>
    </a>
  </main>
  <span class="center-seam" aria-hidden="true"><i></i></span>
</body>
</html>
