<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0b0f11">
  <title>SOOP SEEK · 오비트 | 입구 B 시안</title>
  <link rel="stylesheet" href="variants.css"><link rel="stylesheet" href="orbit.css"><script src="../entrance.js" defer></script>
</head>
<body class="orbit">
  <div class="orbit-stage">
  <main class="entrance" aria-label="게임 선택">
    <a class="game game-fc" href="/fc" aria-label="FC온라인 메인으로 이동">
      <div class="atmosphere" aria-hidden="true"></div><div class="orbital-lines" aria-hidden="true"><i></i></div>
      <div class="object-stage" aria-hidden="true"><img class="object" src="../assets/football-cutout.webp" alt="" fetchpriority="high" width="1448" height="1086"></div>
      <div class="particles" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div class="game-info">
        <h2 class="fc-title"><img class="game-wordmark" src="assets/fc-online-logo-white.png" width="364" height="52" alt="EA SPORTS FC ONLINE"></h2>
        <ul class="game-features" aria-label="FC온라인 주요 기능"><li>상대 전적</li><li>구단가치</li><li>CK·대회</li></ul>
        <div class="game-cta"><span>메인으로</span><span class="arrow" aria-hidden="true">↗</span></div>
      </div>
      <div class="pointer-light" aria-hidden="true"></div>
    </a>
    <a class="game game-lol" href="/lol" aria-label="리그 오브 레전드 전적 검색">
      <div class="atmosphere" aria-hidden="true"></div><div class="orbital-lines" aria-hidden="true"><i></i></div>
      <div class="object-stage" aria-hidden="true"><img class="object" src="../assets/crystal-cutout.webp" alt="" fetchpriority="high" width="1448" height="1086"></div>
      <div class="particles" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div class="game-info">
        <h2 class="lol-title"><img class="game-wordmark" src="assets/league-of-legends-logo-gold.svg" width="735.87" height="287.4" alt="리그 오브 레전드"></h2>
        <ul class="game-features" aria-label="리그 오브 레전드 주요 기능"><li>상대 전적</li><li>챔피언 기록</li><li>CK·대회</li></ul>
        <div class="game-cta"><span>전적 검색</span><span class="arrow" aria-hidden="true">↗</span></div>
      </div>
      <div class="pointer-light" aria-hidden="true"></div>
    </a>
  </main>
  <header class="brand-center" aria-label="SOOP SEEK">
    <div class="brand-halo" aria-hidden="true"></div>
    <div class="brand-slot"><h1 class="brand-logo"><img src="assets/soop-seek-stacked.png" alt="SOOP SEEK" width="1254" height="1254" fetchpriority="high"></h1></div>
    <p class="brand-description"><strong>SOOP 스트리머 기록실</strong><span>전적부터 CK·대회까지</span></p>
  </header>
  </div>
</body>
</html>
