<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#090e10">
  <title>A · 센터 스테이지 | 입구 2차 시안</title>
  <link rel="stylesheet" href="variants.css"><script src="../entrance.js" defer></script>
</head>
<body class="stage">
  <main class="entrance" aria-label="게임 선택">
    <a class="game game-fc" href="/fc/search" aria-label="FC온라인 전적 검색">
      <div class="atmosphere" aria-hidden="true"></div>
      <div class="geometry pitch" aria-hidden="true"><i></i><b></b></div>
      <div class="object-stage" aria-hidden="true"><img class="object" src="../assets/football-cutout.webp" alt="" fetchpriority="high" width="1448" height="1086"></div>
      <div class="particles" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div class="game-info"><h2 class="fc-title"><img class="game-wordmark" src="assets/fc-online-logo-white.png" width="364" height="52" alt="EA SPORTS FC ONLINE"></h2><div class="game-cta"><span>전적 검색</span><span class="arrow" aria-hidden="true">↗</span></div></div>
      <div class="pointer-light" aria-hidden="true"></div>
    </a>
    <a class="game game-lol" href="/lol" aria-label="리그 오브 레전드 전적 검색">
      <div class="atmosphere" aria-hidden="true"></div>
      <div class="geometry rune" aria-hidden="true"><i></i></div>
      <div class="object-stage" aria-hidden="true"><img class="object" src="../assets/crystal-cutout.webp" alt="" fetchpriority="high" width="1448" height="1086"></div>
      <div class="particles" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div class="game-info"><h2 class="lol-title"><img class="game-wordmark" src="assets/league-of-legends-logo-gold.svg" width="735.87" height="287.4" alt="리그 오브 레전드"></h2><div class="game-cta"><span>전적 검색</span><span class="arrow" aria-hidden="true">↗</span></div></div>
      <div class="pointer-light" aria-hidden="true"></div>
    </a>
  </main>
  <header class="brand-center" aria-label="서비스 로고 영역"><div class="brand-halo" aria-hidden="true"></div><div class="brand-slot"><span class="crop crop-one" aria-hidden="true"></span><span class="crop crop-two" aria-hidden="true"></span><h1>LOGO</h1><span class="brand-note">로고 영역</span></div><div class="brand-axis" aria-hidden="true"></div></header>
</body>
</html>
