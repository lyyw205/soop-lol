<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#edede7">
  <title>B · 오브제 포스터 | 입구 디자인</title>
  <link rel="stylesheet" href="entrance.css"><script src="entrance.js" defer></script>
</head>
<body class="gallery">
  <header class="gallery-heading"><h1>스트리머 전적</h1><span class="registration" aria-hidden="true">+ <i></i> +</span></header>
  <main class="posters" aria-label="게임 선택">
    <a class="game poster poster-fc" href="/fc/search" aria-label="FC온라인 전적 검색">
      <div class="poster-top"><span>FC온라인</span><span class="poster-index" aria-hidden="true">01 /</span></div>
      <div class="poster-art" aria-hidden="true">
        <div class="poster-word">FC</div>
        <img class="objet drift" src="assets/football-cutout.webp" alt="" fetchpriority="high">
        <div class="poster-outline">FC</div>
      </div>
      <div class="poster-bottom"><div><h2>FC ONLINE</h2><span>전적 검색</span></div><span class="arrow" aria-hidden="true">↗</span></div>
      <span class="poster-rule" aria-hidden="true"></span>
    </a>
    <a class="game poster poster-lol" href="/lol" aria-label="리그 오브 레전드 전적 검색">
      <div class="poster-top"><span>리그 오브 레전드</span><span class="poster-index" aria-hidden="true">02 /</span></div>
      <div class="poster-art" aria-hidden="true">
        <div class="poster-word">LoL</div>
        <img class="objet drift" src="assets/crystal-cutout.webp" alt="" fetchpriority="high">
        <div class="poster-outline">LoL</div>
      </div>
      <div class="poster-bottom"><div><h2>LEAGUE OF LEGENDS</h2><span>전적 검색</span></div><span class="arrow" aria-hidden="true">↗</span></div>
      <span class="poster-rule" aria-hidden="true"></span>
    </a>
  </main>
  <div class="gallery-foot" aria-hidden="true"><span>+</span><span>+</span></div>
</body>
</html>
