<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#111414">
  <title>C · 게임 인덱스 | 입구 디자인</title>
  <link rel="stylesheet" href="entrance.css"><script src="entrance.js" defer></script>
</head>
<body class="index">
  <header class="index-heading"><h1>스트리머 전적</h1><span aria-hidden="true">01 — 02</span></header>
  <main class="game-index" aria-label="게임 선택">
    <a class="game strip strip-fc" href="/fc/search" aria-label="FC온라인 전적 검색">
      <span class="strip-number" aria-hidden="true">01</span>
      <div class="strip-graphic" aria-hidden="true">
        <img class="strip-art drift" src="/images/fc/home-stadium.png" alt="" fetchpriority="high">
        <div class="pitch"><i></i><b></b></div>
        <span class="speed speed-one"></span><span class="speed speed-two"></span>
      </div>
      <div class="strip-body"><h2>FC<span>ONLINE</span></h2><div class="strip-meta"><span>FC온라인</span><span>전적 검색 <i aria-hidden="true">↗</i></span></div></div>
      <span class="strip-go" aria-hidden="true">↗</span>
      <span class="strip-corner" aria-hidden="true">FC / 01</span>
    </a>
    <a class="game strip strip-lol" href="/lol" aria-label="리그 오브 레전드 전적 검색">
      <span class="strip-number" aria-hidden="true">02</span>
      <div class="strip-graphic" aria-hidden="true">
        <img class="strip-art drift" src="/images/arena/LeeSin.jpg" alt="" fetchpriority="high">
        <div class="rune rune-one"></div><div class="rune rune-two"></div>
      </div>
      <div class="strip-body"><h2>LEAGUE<span>OF LEGENDS</span></h2><div class="strip-meta"><span>리그 오브 레전드</span><span>전적 검색 <i aria-hidden="true">↗</i></span></div></div>
      <span class="strip-go" aria-hidden="true">↗</span>
      <span class="strip-corner" aria-hidden="true">LOL / 02</span>
    </a>
  </main>
</body>
</html>
